subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
        maven {
            url 'https://libraries.minecraft.net/'
            content { includeGroup 'net.minecraft'; includeGroup 'com.mojang' }
        }
        maven {
            url 'https://maven.minecraftforge.net/'
            content { includeGroup 'net.minecraftforge' }
            // Old Forge builds (1.7.10) were published without POMs.
            metadataSources {
                mavenPom()
                artifact()
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// Real 1.7.10 mods under test (corpus/, not in git) for dev runs. -Pcorpus=name1,name2 picks the jars
// whose file names contain one of the (case-insensitive) parts; -Pcorpus=none runs only the test mod.
// The mods folder is replaced each run, so mods from an earlier selection don't linger.
ext.syncCorpus = { File modsDir ->
    modsDir.mkdirs()
    // Also the 1.7.10 subfolder, where some mods' dependency loaders move libraries.
    [modsDir, new File(modsDir, '1.7.10')].each { dir ->
        dir.listFiles()?.each { if (it.isFile() && (it.name.endsWith('.jar') || it.name.endsWith('.zip')) && it.name != 'hello1710.jar') it.delete() }
    }
    def parts = rootProject.findProperty('corpus')?.toString()?.toLowerCase()?.split(',')?.collect { it.trim() }?.findAll { it }
    rootProject.file('corpus').listFiles().findAll { it.isFile() && (it.name.endsWith('.jar') || it.name.endsWith('.zip')) }.each { mod ->
        if (parts == null || parts.any { mod.name.toLowerCase().contains(it) }) {
            java.nio.file.Files.copy(mod.toPath(), new File(modsDir, mod.name).toPath())
        }
    }
}

// Legacy-side half of the world bridge. Loaded by the LaunchClassLoader, so it runs as part
// of the 1.7.10 world and compiles against its classes (SRG names), like a 1.7.10 mod.
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.compilerArgs << '-Xlint:-options'
}

dependencies {
    compileOnly project(':bridge-api')
    compileOnly project(':legacy-boot') // GL emulation (retrofit.legacy.gl)
    compileOnly('net.minecraft:launchwrapper:1.12') { transitive = false }
    // The Netty version 1.7.10 ships (PacketBuffer wraps its ByteBuf).
    compileOnly 'io.netty:netty-all:4.0.10.Final'
    // Libraries of the 1.7.10 classpath that legacy APIs expose.
    compileOnly('com.mojang:authlib:1.5.21') { transitive = false }
    compileOnly 'com.google.guava:guava:17.0'
    compileOnly 'com.google.code.gson:gson:2.2.4'
    compileOnly files(rootProject.file('run/legacy-srg/minecraft-1.7.10-forge-srg.jar'))
}

tasks.named('compileJava') {
    dependsOn ':harness:dumpSrgJar'
}

// Stand-ins for APIs 1.7.10 mods ship themselves (CoFH's RF, IC2's energy net): the bridge compiles
// against them, and at run time they resolve to the copies in the installed mods. Classes that use
// them load only when a mod provides the API (see Energy). Not packaged.
sourceSets {
    stubs {
        java.srcDir 'src/stubs/java'
        compileClasspath += files(rootProject.file('run/legacy-srg/minecraft-1.7.10-forge-srg.jar'))
    }
}
tasks.named('compileStubsJava') {
    dependsOn ':harness:dumpSrgJar'
    options.release = 8
}
dependencies {
    compileOnly sourceSets.stubs.output
}

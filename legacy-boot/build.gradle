// Code that runs inside the 1.7.10 world. It is read by Forge 1.7.10's ASM 5,
// so it must be compiled to Java 8 bytecode.
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.compilerArgs << '-Xlint:-options'
}

dependencies {
    compileOnly('net.minecraft:launchwrapper:1.12') { transitive = false }
    compileOnly 'org.ow2.asm:asm-all:5.2' // the version legacy code runs with (LegacyInstall.REPLACED_LIBRARIES)
    // Retrofit's replacement for Forge's log4j 2.0-beta9 (see LegacyInstall.REPLACED_LIBRARIES).
    compileOnly 'org.apache.logging.log4j:log4j-api:2.19.0'
    compileOnly 'org.apache.logging.log4j:log4j-to-slf4j:2.19.0'
    compileOnly 'org.slf4j:slf4j-api:2.0.1'
}

// Input APIs can be queried by common mod handlers even on a dedicated server without LWJGL.
dependencies { testImplementation 'org.ow2.asm:asm-all:5.2' }
tasks.register('checkHeadlessInput', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'retrofit.legacy.boot.HeadlessInputCheck'
}
tasks.named('check') { dependsOn tasks.named('checkHeadlessInput') }

tasks.register('checkTextureUploads', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'retrofit.legacy.gl.TextureUploadCheck'
    if (project.hasProperty('textureMalformedOnly')) args 'malformed'
}
tasks.named('check') { dependsOn tasks.named('checkTextureUploads') }

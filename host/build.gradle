// Java 17 host-side code that boots the legacy world. Used by the harness and
// compiled into the Forge mod. Gson and SLF4J are provided by Minecraft 1.20.1 at
// runtime, so they are compile-only here; commons-compress is fetched at runtime.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    compileOnly 'com.google.code.gson:gson:2.10'
    compileOnly 'org.slf4j:slf4j-api:2.0.1'
}

dependencies { testRuntimeOnly 'org.slf4j:slf4j-api:2.0.1' }
tasks.register('checkRuntimeMemory', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'retrofit.host.RuntimeMemoryCheck'
}
tasks.named('check') { dependsOn tasks.named('checkRuntimeMemory') }

tasks.register('checkRuntimeIsolation', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'retrofit.host.RuntimeIsolationCheck'
}
tasks.named('check') { dependsOn tasks.named('checkRuntimeIsolation') }
